[project]
name = "proyecto-sonda-parker-desoft"
version = "1.0.0"
description = "Descarga, procesamiento y visualización de datos de viento solar de la sonda Parker Solar Probe (PSP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Barbara Quilodrán, Martina Molina, Thiare Molina, Ivannia Villalba" }
]

dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "numpy",
    "cdflib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["test_*.py"]